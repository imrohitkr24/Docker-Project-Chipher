name: Deploy to Production EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Images
        run: |
          # Build images
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusops-frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusops-backend:latest ./backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusops-monitoring:latest ./monitoring-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusops-nginx:latest ./nginx

          # Push images
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusops-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusops-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusops-monitoring:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusops-nginx:latest

